<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DNC &amp; Identity Lookup</title>
  <style>
    /* This page is only the frame around the panel. The panel itself is widget.js - the very file the
       toolbar icon injects into a page - so the detached window and the in-page copy are one interface
       rather than two that drift apart. Nothing here may style the panel: it lives in its own shadow
       root, so this is only what shows behind and around it. */
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #f4f4f6;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <!-- Loaded first so a failure to start the panel is readable on the page instead of leaving it blank.
       It is a file, not an inline script: the extension CSP allows only `self` scripts in an extension page. -->
  <script src="window-panel-guard.js"></script>
  <script src="widget.js"></script>
</body>
</html>
